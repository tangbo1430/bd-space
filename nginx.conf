server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # 静态资源长缓存（Astro 产物带内容哈希）
  location /_astro/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ $uri/index.html =404;
  }

  # 404 使用站点自定义错误页
  error_page 404 /404.html;
  location = /404.html {
    internal;
  }
}
